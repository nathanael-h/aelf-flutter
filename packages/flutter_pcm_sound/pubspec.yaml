name: flutter_pcm_sound
description: Send real-time PCM audio (16-bit integer) to your device speakers
# Local copy of flutter_pcm_sound 3.3.3 (public domain), with a Swift Package
# for iOS and macOS: see README.md.
version: 3.3.3+spm
homepage: https://github.com/chipweinberger/flutter_pcm_sound
publish_to: none

environment:
  sdk: ">=2.15.1 <4.0.0"
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.lib.flutter_pcm_sound
        pluginClass: FlutterPcmSoundPlugin
      ios:
        pluginClass: FlutterPcmSoundPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FlutterPcmSoundPlugin
        sharedDarwinSource: true
