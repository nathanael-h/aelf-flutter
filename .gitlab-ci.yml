stages:
- test # Fast checks on every commit; integration tests on merge requests
- build
- deploy

variables:
  FLUTTER_VERSION: "3.41.6"

# ---------------------------------------------------------------------------
# One pipeline per commit, on the newest commit only.
#
# - Feature branches run in merge request pipelines only: a push to a branch
#   without an MR runs nothing, and opening the MR starts its single pipeline.
#   (Keying on $CI_OPEN_MERGE_REQUESTS instead races: pushing a branch and
#   opening its MR a second later ran a branch pipeline *and* an MR pipeline.)
#   master and tags still run on push; "Run pipeline" in the UI still works on
#   any branch.
# - When a push lands several commits, or a new push supersedes a running
#   pipeline, the older pipelines are cancelled so CI only reports on the tip.
#   Requires GitLab >= 16.8; on older instances use the project setting
#   Settings > CI/CD > General pipelines > "Auto-cancel redundant pipelines".
# ---------------------------------------------------------------------------
workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_TAG
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # Web/API/schedule runs are explicit requests, so honour them on any branch.
  - if: $CI_PIPELINE_SOURCE =~ /^(web|api|schedule|trigger)$/
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

# ---------------------------------------------------------------------------
# Every commit: formatting, static analysis and the unit/widget test suite.
# These run in a few seconds and are the regression net protecting the online
# (AELF API) liturgy while the offline liturgy is built behind a feature flag.
# ---------------------------------------------------------------------------

.linux-flutter:
  image: ghcr.io/cirruslabs/flutter:$FLUTTER_VERSION
  tags:
  - saas-linux-small-amd64
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH

format:
  extends: .linux-flutter
  stage: test
  before_script:
  - flutter doctor -v
  - flutter pub get
  script:
  - echo "Verify the code dart code is formated"
  - dart format --set-exit-if-changed lib
  allow_failure: true

analyze:
  extends: .linux-flutter
  stage: test
  before_script:
  - flutter pub get
  script:
  # Infos are not fatal: the tree carries pre-existing style lints. Warnings
  # and errors are, so new ones cannot land.
  - flutter analyze --no-fatal-infos

unit-test:
  extends: .linux-flutter
  stage: test
  before_script:
  - flutter pub get
  script:
  # `flutter test` through tool/test_runner.dart: app logs are only printed for
  # failing tests, and the results go to a JUnit report GitLab shows in the
  # pipeline Tests tab and the merge request Test summary.
  - dart tool/test_runner.dart --junit build/test-results/unit.xml -- --coverage
  # flutter test writes lcov.info but prints no percentage; this emits the
  # summary line the coverage: regex below matches on.
  - scripts/coverage_summary.sh
  coverage: '/^\s*lines\.*:\s*([\d\.]+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
    - coverage/lcov.info
    - build/test-results/
    reports:
      junit: build/test-results/*.xml

# ---------------------------------------------------------------------------
# Merge requests and the default branch: the integration suite drives the real
# app on a Linux desktop build under Xvfb. Slower (a few minutes), so it gates
# merges rather than every push — but it also runs on a direct push to master,
# so nothing reaches the default branch untested when a merge request is
# bypassed.
# ---------------------------------------------------------------------------

.integration-test-rules:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.integration-test:
  image: ghcr.io/cirruslabs/flutter:$FLUTTER_VERSION
  stage: test
  tags:
  - saas-linux-medium-amd64
  before_script:
  # Toolchain and GTK headers for `flutter build linux`, plus a virtual display.
  - apt-get update -qq
  # lld is required and not pulled in by clang: Flutter's Linux build looks for
  # a linker in /usr/lib/llvm-18/bin, which only the lld package populates
  # (binutils' /usr/bin/ld is not found there).
  # dpkg prints ~1000 lines even with -qq; keep them out of the job log unless
  # the install fails.
  - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq
    clang lld cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
    libstdc++-12-dev libsqlite3-dev xvfb > apt.log 2>&1
    || { cat apt.log; exit 1; }
  - flutter config --enable-linux-desktop
  - flutter pub get
  # scripts/run_integration_tests.sh writes one JUnit report per test file.
  artifacts:
    when: always
    expire_in: 1 week
    paths:
    - build/test-results/
    reports:
      junit: build/test-results/*.xml

integration-test:
  extends: [ .integration-test, .integration-test-rules ]
  script:
  # The online liturgy, the app shell and the feature-flag switch: everything
  # that must keep working for users today. Blocking.
  - xvfb-run -a --server-args="-screen 0 1280x800x24"
    scripts/run_integration_tests.sh linux
    integration_test/app_launch_test.dart
    integration_test/online_liturgy_test.dart
    integration_test/feature_flag_test.dart

integration-test-offline:
  extends: [ .integration-test, .integration-test-rules ]
  # The offline liturgy is still being built: report it, do not block a merge
  # request that only touches the online path.
  allow_failure: true
  script:
  - xvfb-run -a --server-args="-screen 0 1280x800x24"
    scripts/run_integration_tests.sh linux
    integration_test/offline_liturgy_test.dart

# ---------------------------------------------------------------------------
# Build and deploy (unchanged)
# ---------------------------------------------------------------------------

# source: https://medium.com/kinandcartacreated/setup-a-flutter-ci-cd-with-gitlab-ci-part-3-8e67c91c6da7
build-ios:
  # This job runs in the build stage, which runs first.
  stage: build
  before_script:
  - fvm use $FLUTTER_VERSION -f
  - fvm flutter doctor -v
  - fvm flutter pub get
  - fvm flutter clean
  script:
  - echo "Compiling the code for iOS..."
  - fvm flutter build ipa
  after_script:
  - mv build/ios/ipa/AELF.ipa aelf-$CI_COMMIT_SHORT_SHA.ipa
  artifacts:
    name: aelf-$CI_COMMIT_SHORT_SHA.ipa
    paths:
    - aelf-$CI_COMMIT_SHORT_SHA.ipa
  tags:
  - aelf
  - macos
  allow_failure: true
  when: manual

build-android:
  rules:
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        when: always
      - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
        when: manual
  image: ghcr.io/cirruslabs/flutter:$FLUTTER_VERSION
  stage: build
  before_script:
  - flutter doctor -v
  - flutter pub get
  - flutter clean
  script:
  - echo "Compiling the code for Android..."
  - flutter build apk
  after_script:
  - mv build/app/outputs/apk/release/app-release.apk aelf-flutter-"$CI_COMMIT_SHORT_SHA".apk
  artifacts:
    name: aelf-flutter-$CI_COMMIT_SHORT_SHA
    paths:
    - aelf-flutter-$CI_COMMIT_SHORT_SHA.apk
  tags:
  - saas-linux-small-amd64

deploy-ios:
  stage: deploy
  # An upload to TestFlight must never be cancelled half-way by a newer commit.
  interruptible: false
  #  dependencies:
  #  - build-ios
  needs: [ "build-ios" ]
  script:
  - echo "Uploading to testflight..."
  - xcrun altool --upload-app --type ios -f *.ipa --username $ci_username_apple --password $ci_pwd_apple
  tags:
  - macos
  - aelf
  rules:
  - if: $CI_COMMIT_TAG != null
